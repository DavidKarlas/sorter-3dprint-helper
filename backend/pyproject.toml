[project]
name = "sorter3mf"
version = "0.1.0"
description = "Builds Bambu Studio-ready .3mf projects (plates, colours, print settings) for the Sorter V2 printed parts."
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sorter3mf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
